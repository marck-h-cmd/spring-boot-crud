<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Categorías</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2 th:text="${titulo}"></h2>
        <a th:href="@{/categoria/crear}" class="btn btn-primary mb-3">Nueva Categoría</a>
        
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="categoria : ${categorias}">
                    <td th:text="${categoria.id}"></td>
                    <td th:text="${categoria.descripcion}"></td>
                    <td>
                        <a th:href="@{/categoria/editar/} + ${categoria.id}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/categoria/eliminar/} + ${categoria.id}" class="btn btn-sm btn-danger">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
