<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${titulo}">Formulario Proveedor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <header th:replace="~{fragments/header::header}"></header>
    
    <section class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white" th:text="${titulo}"></div>
            <div class="card-body">
                <form th:action="@{/proveedor/guardar}" th:object="${proveedor}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:name="modo" th:value="${modo}">
                    
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>RUC</label>
                            <input type="text" th:field="*{ruc}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('ruc')} ? 'is-invalid' : ''" 
                                   required maxlength="11">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('ruc')}" 
                                 th:errors="*{ruc}"></div>
                        </div>
                        <div class="form-group col-md-6">
                            <label>Razón Social</label>
                            <input type="text" th:field="*{razonSocial}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('razonSocial')} ? 'is-invalid' : ''" 
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('razonSocial')}" 
                                 th:errors="*{razonSocial}"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Nombre Comercial</label>
                        <input type="text" th:field="*{nombreComercial}" class="form-control" 
                               th:classappend="${#fields.hasErrors('nombreComercial')} ? 'is-invalid' : ''" 
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreComercial')}" 
                             th:errors="*{nombreComercial}"></div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Teléfono</label>
                            <input type="text" th:field="*{telefono}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''" 
                                   required maxlength="9">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" 
                                 th:errors="*{telefono}"></div>
                        </div>
                        <div class="form-group col-md-6">
                            <label>Email</label>
                            <input type="email" th:field="*{email}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" 
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" 
                                 th:errors="*{email}"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" th:field="*{direccion}" class="form-control" 
                               th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid' : ''" 
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('direccion')}" 
                             th:errors="*{direccion}"></div>
                    </div>
                    
                    <div class="form-group form-check">
                        <input type="checkbox" th:field="*{activo}" class="form-check-input">
                        <label class="form-check-label">Activo</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                    <a th:href="@{/proveedor/listar}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </form>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
