<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>

	  <header th:replace="~{fragments/header::header}"></header>
    <div class="container mt-4">
        <h2 th:text="${titulo}"></h2>
        
        <form th:action="@{/unidad/guardar}" th:object="${unidad}" method="post">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" name="modo" th:value="${modo}">
            
            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <input type="text" th:field="*{descripcion}" class="form-control"
                       th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" 
                     th:errors="*{descripcion}"></div>
            </div>
            
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/unidad/listar}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
