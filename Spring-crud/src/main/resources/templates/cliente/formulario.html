<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${titulo}">Formulario Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white" th:text="${titulo}"></div>
            <div class="card-body">
                <form th:action="@{/cliente/guardar}" th:object="${cliente}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:name="modo" th:value="${modo}">
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Apellido</label>
                            <input type="text" th:field="*{apellido}" class="form-control"
                                   th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{apellido}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{nombre}"></div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" th:field="*{direccion}" class="form-control">
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Sexo</label>
                            <select th:field="*{sexo}" class="form-select"
                                    th:classappend="${#fields.hasErrors('sexo')} ? 'is-invalid' : ''">
                                <option value="">Seleccione...</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{sexo}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">RUC/DNI</label>
                            <input type="text" th:field="*{rucDni}" class="form-control"
                                   th:classappend="${#fields.hasErrors('rucDni')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{rucDni}"></div>
                        </div>
                    </div>
                    
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" th:field="*{estado}" id="estadoCheck">
                        <label class="form-check-label" for="estadoCheck">Activo</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                    <a th:href="@{/cliente/listar}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
