<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${titulo}">Formulario Venta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
  <header th:replace="~{fragments/header::header}"></header>
<form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">
    <div class="mb-3">
        <label>Cliente</label>
        <select th:field="*{cliente.id}" class="form-select">
            <option th:each="cliente : ${clientes}" 
                    th:value="${cliente.id}"
                    th:text="${cliente.apellido + ', ' + cliente.nombre}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label>Productos</label>
        <table class="table">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="detalle, stat : *{detalles}">
                    <td>
                        <select th:field="*{detalles[__${stat.index}__].producto.id}" class="form-select">
                            <option th:each="producto : ${productos}" 
                                    th:value="${producto.id}"
                                    th:text="${producto.nombre + ' (Stock: ' + producto.stock + ')'}"></option>
                        </select>
                    </td>
                    <td>
                        <input type="number" th:field="*{detalles[__${stat.index}__].cantidad}" class="form-control" min="1">
                    </td>
                    <td>
                        <input type="number" th:field="*{detalles[__${stat.index}__].precio}" class="form-control" min="0.01" step="0.01">
                    </td>
                    <td th:text="${detalle.subtotal}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <button type="submit" class="btn btn-primary">Guardar Venta</button>
</form>

</body>
