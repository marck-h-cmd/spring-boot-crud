<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
<head>
    <title th:text="${titulo}">Formulario Empleado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
    <section layout:fragment="content">
        <div class="card">
            <div class="card-header" th:text="${titulo}"></div>
            <div class="card-body">
                <form th:action="@{/empleado/guardar}" th:object="${empleado}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="form-group">
                        <label>Nombres</label>
                        <input type="text" th:field="*{nombres}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Apellidos Paterno</label>
                        <input type="text" th:field="*{apellidosPaterno}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Apellidos Materno</label>
                        <input type="text" th:field="*{apellidosMaterno}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label>DNI</label>
                        <input type="text" th:field="*{dni}" class="form-control" required maxlength="8">
                    </div>
                    
                    <div class="form-group">
                        <label>Fecha Nacimiento</label>
                        <input type="date" th:field="*{fechaNacimiento}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Celular</label>
                        <input type="text" th:field="*{celular}" class="form-control" maxlength="9">
                    </div>
                    
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Cargo</label>
                        <input type="text" th:field="*{cargo}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Salario</label>
                        <input type="number" step="0.01" th:field="*{salario}" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Fecha Contratación</label>
                        <input type="date" th:field="*{fechaContratacion}" class="form-control" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                    <a th:href="@{/empleado/index}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
