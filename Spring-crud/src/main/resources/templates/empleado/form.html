<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${titulo}">Formulario Empleado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <header th:replace="~{fragments/header::header}"></header>
    
    <section class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white" th:text="${titulo}"></div>
            <div class="card-body">
                <form th:action="@{/empleado/guardar}" th:object="${empleado}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:name="modo" th:value="${modo}">
                    
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label>Nombres</label>
                            <input type="text" th:field="*{nombres}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('nombres')} ? 'is-invalid' : ''" 
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombres')}" 
                                 th:errors="*{nombres}"></div>
                        </div>
                        <div class="form-group col-md-4">
                            <label>Apellido Paterno</label>
                            <input type="text" th:field="*{apellidosPaterno}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('apellidosPaterno')} ? 'is-invalid' : ''" 
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('apellidosPaterno')}" 
                                 th:errors="*{apellidosPaterno}"></div>
                        </div>
                        <div class="form-group col-md-4">
                            <label>Apellido Materno</label>
                            <input type="text" th:field="*{apellidosMaterno}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('apellidosMaterno')} ? 'is-invalid' : ''" 
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('apellidosMaterno')}" 
                                 th:errors="*{apellidosMaterno}"></div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>DNI</label>
                            <input type="text" th:field="*{dni}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid' : ''" 
                                   required maxlength="8">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('dni')}" 
                                 th:errors="*{dni}"></div>
                        </div>
                        <div class="form-group col-md-6">
                            <label>Fecha Nacimiento</label>
                            <input type="date" th:field="*{fechaNacimiento}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid' : ''" 
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaNacimiento')}" 
                                 th:errors="*{fechaNacimiento}"></div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Celular</label>
                            <input type="text" th:field="*{celular}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('celular')} ? 'is-invalid' : ''" 
                                   maxlength="9">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('celular')}" 
                                 th:errors="*{celular}"></div>
                        </div>
                        <div class="form-group col-md-6">
                            <label>Email</label>
                            <input type="email" th:field="*{email}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" 
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" 
                                 th:errors="*{email}"></div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Cargo</label>
                            <input type="text" th:field="*{cargo}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('cargo')} ? 'is-invalid' : ''" 
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('cargo')}" 
                                 th:errors="*{cargo}"></div>
                        </div>
                        <div class="form-group col-md-6">
                            <label>Salario</label>
                            <input type="number" step="0.01" th:field="*{salario}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('salario')} ? 'is-invalid' : ''" 
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('salario')}" 
                                 th:errors="*{salario}"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Fecha Contratación</label>
                        <input type="date" th:field="*{fechaContratacion}" class="form-control" 
                               th:classappend="${#fields.hasErrors('fechaContratacion')} ? 'is-invalid' : ''" 
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaContratacion')}" 
                             th:errors="*{fechaContratacion}"></div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                    <a th:href="@{/empleado/listar}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </form>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
